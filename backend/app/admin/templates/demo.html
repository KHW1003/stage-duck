{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="col-12">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">시연 데이터 초기화</h3>
    </div>
    <div class="card-body">
      <p>관리자 계정을 뺀 모든 데이터를 지우고 시드 데이터(사용자 1명, 업체 A~G)를 다시 넣어요. 테스트 환경에서만 동작해요.</p>
      <form method="post" onsubmit="return confirm('모든 시연 데이터를 지우고 처음 상태로 되돌릴까요?');">
        <button type="submit" class="btn btn-danger">시연 데이터 초기화</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
