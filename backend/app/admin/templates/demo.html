{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="col-12">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">시연 데이터 초기화</h3>
    </div>
    <div class="card-body">
      <p>관리자 계정만 남기고 모든 데이터를 지운 뒤, 기본 시연 데이터(뮤지션 1명, 업체 A~G, 공간 A~C)를 다시 넣어요.</p>
      <p class="text-secondary">시연 서버에서만 쓸 수 있어요. 되돌릴 수 없으니 발표 직전에만 눌러 주세요.</p>
      <form method="post" onsubmit="return confirm('모든 시연 데이터를 지우고 처음 상태로 되돌릴까요?');">
        <button type="submit" class="btn btn-danger">시연 데이터 초기화</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
