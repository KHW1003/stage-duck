# 개발용 MariaDB (Docker가 있는 팀원용). Docker가 없으면 MariaDB 11.4를 직접 설치해도 된다 (README 참고).
# 백엔드·프론트 컨테이너는 배포 단계에서 추가한다.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: stageduck
      MARIADB_USER: stageduck
      MARIADB_PASSWORD: stageduck
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+09:00"]
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
