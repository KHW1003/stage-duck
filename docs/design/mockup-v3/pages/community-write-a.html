<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 글쓰기 A · STAGE DUCK</title>
<link rel="preload" href="../../mockup/assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/app.css">
<style>
  /* CommunityWritePage.module.css — 시안 3개 */
  .narrow { max-width: 820px; margin: 0 auto; }
  .count-line { display: flex; justify-content: space-between; color: var(--sd-muted); font-size: var(--sd-text-small); }
  .uploader { display: flex; gap: 10px; flex-wrap: wrap; }
  .uploader__add { display: grid; place-items: center; align-content: center; gap: 4px; width: 96px; aspect-ratio: 1; border: 1px dashed var(--sd-line-strong); border-radius: var(--sd-r-box); color: var(--sd-muted); font-size: var(--sd-text-small); }
  .uploader__item { position: relative; width: 96px; aspect-ratio: 1; border-radius: var(--sd-r-box); background: var(--sd-photo) center/cover; background-image: var(--img); }
  .uploader__item button { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--sd-dim); color: var(--sd-on-photo); }
  .rules li { position: relative; padding-left: 12px; font-size: var(--sd-text-desc); line-height: 1.6; color: var(--sd-muted); }
  .rules li::before { content: ""; position: absolute; left: 0; top: .7em; width: 4px; height: 4px; border-radius: 50%; background: var(--sd-muted); }
  .rules li + li { margin-top: 6px; }

  /* A 한 줄 폼 */
  .form-a { display: grid; gap: 24px; padding-top: 8px; }
  .form-a .textarea { min-height: 320px; }
</style>
</head>
<!-- 시안: 글쓰기 A 한 줄 폼
     화면: 커뮤니티 글쓰기 · 제안 화면 (스펙에 아직 없음 — 해원 승인 전)
     React(안): pages/CommunityWritePage.tsx = PrefixSelect + TitleInput + BodyEditor + PhotoUploader + Submit — React Hook Form + zod, 서버 fieldErrors 우선
     본문의 전화번호·계좌번호·외부 링크는 서버에서 막는다 (3번 has_contact_pattern 재사용 제안). 오류 값 보기: ?err=bad -->
<body data-layout="user" data-nav="community">

<div class="mock-switch" data-group="err" style="bottom:64px">
  <span>입력</span>
  <button type="button" data-value="ok" aria-pressed="true">정상</button>
  <button type="button" data-value="bad">오류</button>
</div>

<div class="page-top"><div class="container page-top__inner"><div><ol class="page-top__crumb"><li><a href="community-list-a.html">커뮤니티</a></li><li>글쓰기</li></ol><h1>글쓰기</h1></div></div></div>

<main class="container main">

  <!-- ───── A 한 줄 폼: 위에서 아래로 한 칸씩. 가운데 좁은 폭이라 쓰는 데만 집중해요 ───── -->
  <div class="narrow">
    <form class="form-a">
      <label class="field"><span class="field__label">말머리<span class="req">*</span></span><select class="select" style="max-width:240px"><option>[질문]</option><option>[자유]</option><option>[정보]</option><option>[공연 소식]</option></select></label>
      <label class="field"><span class="field__label">제목<span class="req">*</span></span><input class="input" value="스탠딩 80명 공연, 리허설은 몇 시간 전에 시작하나요?" maxlength="60"><span class="count-line"><span class="field__hint">60자까지 쓸 수 있어요.</span><span>27 / 60</span></span></label>
      <label class="field"><span class="field__label">내용<span class="req">*</span></span>
        <textarea class="textarea" data-when="err:ok">다음 달에 첫 공연을 해요. 공연장 입실이 15시이고 공연은 19시인데, 리허설을 언제 시작해야 장비 설치랑 안 겹칠지 모르겠어요.
경험 있으신 분들 조언 부탁드려요.</textarea>
        <textarea class="textarea" aria-invalid="true" data-when="err:bad" hidden>장비 업체 사장님이 직접 연락 달라고 하셔서요. 010-0000-0000으로 문자 주세요.</textarea>
        <span class="field__error" data-when="err:bad" hidden><span data-icon="warn" class="icon--sm"></span>전화번호는 쓸 수 없어요. 연락처를 빼고 다시 올려 주세요.</span>
        <span class="count-line"><span class="field__hint">전화번호·계좌번호·외부 링크는 쓸 수 없어요.</span><span>84 / 2,000</span></span></label>
      <div class="field"><span class="field__label">사진<span class="opt">선택 · 최대 10장</span></span>
        <div class="uploader"><button class="uploader__add" type="button"><span data-icon="image"></span>2 / 10</button><span class="uploader__item" role="img" aria-label="첨부 사진 1" style="--img:url('../../mockup/assets/photos/photo-1524368535928-5b5e00ddc76b.jpg')"><button type="button" aria-label="사진 1 빼기"><span data-icon="x" class="icon--sm"></span></button></span><span class="uploader__item" role="img" aria-label="첨부 사진 2" style="--img:url('../../mockup/assets/photos/photo-1598488035139-bdbb2231ce04.jpg')"><button type="button" aria-label="사진 2 빼기"><span data-icon="x" class="icon--sm"></span></button></span></div></div>
      <div class="btns btns--end"><a class="btn" href="community-list-a.html">취소</a><button class="btn btn--primary" type="submit">올리기</button></div>
    </form>
  </div>

  <!-- ───── B 표 폼 + 오른쪽 안내: 요청서와 같은 이름-값 표. 오른쪽에 쓰기 규칙이 늘 보여요 ───── -->
  

  <!-- ───── C 쓰기 판: 말머리 칩 → 큰 제목 → 도구 줄 + 본문이 한 판에. 아래 줄은 따라와요 ───── -->
  
</main>
<script src="../layout.js"></script>
<script src="community-nav.js"></script>
</body>
</html>
