<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 글쓰기 C · STAGE DUCK</title>
<link rel="preload" href="../../mockup/assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/app.css">
<style>
  /* CommunityWritePage.module.css — 시안 3개 */
  .narrow { max-width: 820px; margin: 0 auto; }
  .count-line { display: flex; justify-content: space-between; color: var(--sd-muted); font-size: var(--sd-text-small); }
  .uploader { display: flex; gap: 10px; flex-wrap: wrap; }
  .uploader__add { display: grid; place-items: center; align-content: center; gap: 4px; width: 96px; aspect-ratio: 1; border: 1px dashed var(--sd-line-strong); border-radius: var(--sd-r-box); color: var(--sd-muted); font-size: var(--sd-text-small); }
  .uploader__item { position: relative; width: 96px; aspect-ratio: 1; border-radius: var(--sd-r-box); background: var(--sd-photo) center/cover; background-image: var(--img); }
  .uploader__item button { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--sd-dim); color: var(--sd-on-photo); }
  .rules li { position: relative; padding-left: 12px; font-size: var(--sd-text-desc); line-height: 1.6; color: var(--sd-muted); }
  .rules li::before { content: ""; position: absolute; left: 0; top: .7em; width: 4px; height: 4px; border-radius: 50%; background: var(--sd-muted); }
  .rules li + li { margin-top: 6px; }

  /* C 쓰기 판 */
  .editor { border: 1px solid var(--sd-line-strong); border-radius: var(--sd-r-box); overflow: hidden; }
  .editor__title { width: 100%; height: 72px; padding: 0 24px; border: 0; border-bottom: 1px solid var(--sd-line); font: inherit; font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
  .editor__title::placeholder { color: var(--sd-muted); font-weight: 500; }
  .editor__tools { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--sd-line); background: var(--sd-soft); }
  .editor__tools .btn { gap: 6px; }
  .editor__body { width: 100%; min-height: 360px; padding: 24px; border: 0; font: inherit; font-size: var(--sd-text-body); line-height: 1.8; resize: none; }
  .editor__body::placeholder { color: var(--sd-muted); }
  .editor__foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-top: 1px solid var(--sd-line); color: var(--sd-muted); font-size: var(--sd-text-small); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips label { position: relative; }
  .chips input { position: absolute; opacity: 0; }
  .chips span { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border: 1px solid var(--sd-line-strong); border-radius: 999px; font-size: var(--sd-text-desc); cursor: pointer; }
  .chips input:checked + span { border-color: var(--sd-ink); background: var(--sd-ink); color: var(--sd-on-blue); font-weight: 700; }
  .chips input:focus-visible + span { outline: 2px solid var(--sd-focus); outline-offset: 2px; }
  .sticky-foot { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding: 16px 0; border-top: 1px solid var(--sd-line-strong); background: var(--sd-bg); }
</style>
</head>
<!-- 시안: 글쓰기 C 쓰기 판
     화면: 커뮤니티 글쓰기 · 제안 화면 (스펙에 아직 없음 — 해원 승인 전)
     React(안): pages/CommunityWritePage.tsx = PrefixSelect + TitleInput + BodyEditor + PhotoUploader + Submit — React Hook Form + zod, 서버 fieldErrors 우선
     본문의 전화번호·계좌번호·외부 링크는 서버에서 막는다 (3번 has_contact_pattern 재사용 제안). 오류 값 보기: ?err=bad -->
<body data-layout="user" data-nav="community">

<div class="mock-switch" data-group="err" style="bottom:64px">
  <span>입력</span>
  <button type="button" data-value="ok" aria-pressed="true">정상</button>
  <button type="button" data-value="bad">오류</button>
</div>

<div class="page-top"><div class="container page-top__inner"><div><ol class="page-top__crumb"><li><a href="community-list-a.html">커뮤니티</a></li><li>글쓰기</li></ol><h1>글쓰기</h1></div></div></div>

<main class="container main">

  <!-- ───── A 한 줄 폼: 위에서 아래로 한 칸씩. 가운데 좁은 폭이라 쓰는 데만 집중해요 ───── -->
  

  <!-- ───── B 표 폼 + 오른쪽 안내: 요청서와 같은 이름-값 표. 오른쪽에 쓰기 규칙이 늘 보여요 ───── -->
  

  <!-- ───── C 쓰기 판: 말머리 칩 → 큰 제목 → 도구 줄 + 본문이 한 판에. 아래 줄은 따라와요 ───── -->
  <div class="narrow">
    <form>
      <div class="chips" role="radiogroup" aria-label="말머리"><label><input type="radio" name="cat" checked><span>질문</span></label><label><input type="radio" name="cat"><span>자유</span></label><label><input type="radio" name="cat"><span>정보</span></label><label><input type="radio" name="cat"><span>공연 소식</span></label></div>
      <div class="editor mt-16">
        <input class="editor__title" value="스탠딩 80명 공연, 리허설은 몇 시간 전에 시작하나요?" placeholder="제목을 입력해 주세요" aria-label="제목" maxlength="60">
        <div class="editor__tools"><button class="btn btn--sm btn--ghost" type="button"><span data-icon="image" class="icon--sm"></span>사진</button><button class="btn btn--sm btn--ghost" type="button"><span data-icon="calendar" class="icon--sm"></span>공연 날짜 넣기</button></div>
        <textarea class="editor__body" aria-label="내용" data-when="err:ok">다음 달에 첫 공연을 해요. 공연장 입실이 15시이고 공연은 19시인데, 리허설을 언제 시작해야 장비 설치랑 안 겹칠지 모르겠어요.

경험 있으신 분들 조언 부탁드려요.</textarea>
        <textarea class="editor__body" aria-label="내용" aria-invalid="true" data-when="err:bad" hidden>장비 업체 사장님이 직접 연락 달라고 하셔서요. 010-0000-0000으로 문자 주세요.</textarea>
        <div class="editor__foot"><span data-when="err:ok"><span data-icon="info" class="icon--sm"></span> 전화번호·계좌번호·외부 링크는 쓸 수 없어요</span><span class="field__error" data-when="err:bad" hidden><span data-icon="warn" class="icon--sm"></span>전화번호는 쓸 수 없어요. 연락처를 빼고 다시 올려 주세요.</span><span>84 / 2,000</span></div>
      </div>
      <div class="sticky-foot"><span class="small muted">올리면 커뮤니티 목록 맨 위에 보여요</span><div class="btns"><a class="btn" href="community-list-a.html">취소</a><button class="btn btn--primary" type="submit">올리기</button></div></div>
    </form>
  </div>
</main>
<script src="../layout.js"></script>
<script src="community-nav.js"></script>
</body>
</html>
