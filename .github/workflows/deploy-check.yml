# 배포 설정이 바뀐 PR에서 시연 서버 이미지를 실제로 빌드하고 Caddyfile 문법을 검사한다 (specs/deploy.md).
# 서버에 올리지 않는다 (올리기는 deploy.yml, main 머지 때). 로컬에 Docker 가 없어도 PR 에서 확인할 수 있게.
name: Deploy check

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-check:
    name: deploy-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Caddyfile 문법 검사
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS=stageduck.test -e ACME_EMAIL=team@stageduck.test \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: api 이미지 빌드 (화면 빌드 포함)
        run: docker build -f deploy/Dockerfile.api -t stageduck-api:check .

      - name: web 이미지 빌드
        run: docker build -f deploy/Dockerfile.web -t stageduck-web:check .

      - name: api 이미지 안에 화면 빌드가 있는지
        run: docker run --rm --entrypoint sh stageduck-api:check -c 'test -f "$FRONTEND_DIST/index.html" && grep -q "app-head" "$FRONTEND_DIST/index.html"'

      # 이미지는 서명 키가 약하면 시작하지 않는다 (REQUIRE_STRONG_SECRETS) — 아래 실행에 점검용 임시 키를 그 자리에서 만들어 넣는다
      - name: api 이미지로 화면 주소·robots.txt·API 응답 확인 (임시 SQLite, deploy/smoke_check.py)
        run: |
          docker run --rm -e DATABASE_URL=sqlite:////tmp/check.db -e PYTHONPATH=/app \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e ADMIN_SESSION_SECRET="$(openssl rand -hex 32)" \
            -v "$PWD/deploy/smoke_check.py:/tmp/smoke_check.py:ro" \
            --entrypoint python stageduck-api:check /tmp/smoke_check.py
