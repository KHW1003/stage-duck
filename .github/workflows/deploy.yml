# main에 머지되면 시연 서버(EC2)에 배포한다 (specs/deploy.md 5장).
# 저장소 변수 DEPLOY_ENABLED=true·DEPLOY_URL(https://주소) 와 비밀 DEPLOY_HOST·DEPLOY_USER·DEPLOY_SSH_KEY·DEPLOY_KNOWN_HOSTS 를 넣기 전에는 건너뛴다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 서버에서 받아서 다시 띄우기
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd ~/stage-duck
          git fetch --quiet origin main
          git checkout --quiet main
          git merge --ff-only --quiet origin/main
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build --remove-orphans
          docker image prune -f > /dev/null
          EOF

      - name: 살아 있는지 확인
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/v1/health" > /dev/null; then echo "health OK"; exit 0; fi
            sleep 5
          done
          echo "::error::배포 뒤 $URL/api/v1/health 응답이 없습니다. 서버에서 docker compose logs api 를 확인하세요."
          exit 1
