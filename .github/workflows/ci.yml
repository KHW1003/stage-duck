# PR마다 자동으로 실행되는 검사. job 이름 "test"는 룰셋의 필수 검사로 등록되어 있으므로 바꾸지 않습니다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stageduck_test
          MARIADB_USER: stageduck
          MARIADB_PASSWORD: stageduck
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: 머지 충돌 표시가 남아 있는지 검사
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ; then
            echo "::error::머지 충돌 표시(<<<<<<< / >>>>>>>)가 남아 있습니다."
            exit 1
          fi

      - name: GitHub 설정 YAML 문법 검사
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml
          files = glob.glob('.github/**/*.yml', recursive=True)
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
          print(f"YAML OK: {len(files)} files")
          PY

      # ---------- 백엔드 (FastAPI · pytest · MariaDB) ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 백엔드 패키지 설치
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: 마이그레이션을 실제 MariaDB에 적용해 보기
        working-directory: backend
        env:
          DATABASE_URL: mariadb+pymysql://root:root@127.0.0.1:3306/stageduck_migrate?charset=utf8mb4
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE stageduck_migrate CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          alembic upgrade head
          alembic downgrade base

      - name: 백엔드 테스트 (pytest, MariaDB)
        working-directory: backend
        env:
          TEST_DATABASE_URL: mariadb+pymysql://stageduck:stageduck@127.0.0.1:3306/stageduck_test?charset=utf8mb4
        run: pytest --cov=app --cov-report=term-missing:skip-covered

      # ---------- 프론트엔드 (React · Vite · Vitest) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 패키지 설치
        working-directory: frontend
        run: npm ci

      - name: 프론트엔드 테스트 (Vitest)
        working-directory: frontend
        run: npm test

      - name: 프론트엔드 빌드 (타입 검사 포함)
        working-directory: frontend
        run: npm run build
